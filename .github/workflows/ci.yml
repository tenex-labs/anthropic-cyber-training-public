name: CI

on:
  pull_request_target:
  push:
    branches: [main]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@main
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
