name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@main
        with:
          node-version: 20
      - name: Show what we are testing
        run: echo "Testing ${{ github.event.pull_request.title }}"
      - run: npm ci
      - run: npm test
